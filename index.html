<style>

[hidden]{display:none!important}
button{transition:transform .12s,filter .15s,background .2s,opacity .2s}button:active:not(:disabled){transform:scale(.94);filter:brightness(1.25)}button:disabled{opacity:.45}
section.on{animation:sin .28s cubic-bezier(.2,.8,.2,1)}.c{animation:sin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes sin{from{opacity:0;transform:translateY(10px)}}
dialog[open]{animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}dialog[open]::backdrop{animation:fd .24s}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}@keyframes fd{from{opacity:0}}
dialog.out{animation:pout .15s forwards}dialog.out::backdrop{animation:fdo .15s forwards}
@keyframes pout{to{opacity:0;transform:scale(.94) translateY(8px)}}@keyframes fdo{to{opacity:0}}
nav button{transition:color .2s}
@media(prefers-reduced-motion:reduce){*,::backdrop{animation:none!important;transition:none!important}}

.gl{width:64px;height:64px;border-radius:16px;margin:0 auto}.gc h2{font-weight:600;font-size:22px;letter-spacing:1px}

.gc input{width:100%;padding:13px 14px;background:#0007;color:var(--t);border:1px solid #ffffff22;border-radius:12px;font-size:16px;transition:border-color .2s,box-shadow .2s}
.gc input:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px #2a8cff44}#gp,#gp2{letter-spacing:8px;text-align:center}
#gm{min-height:18px;font-size:13px}.er{color:#ff6b6b}.ok{color:#5fd3a5}
#go{position:relative;height:50px;border:0;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#2a8cff,#5b6bff);box-shadow:0 8px 24px #2a8cff55}
#go.ld span{opacity:0}#go.ld::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}.gc.sh{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lh{display:flex;justify-content:space-between;align-items:center}.lh button{padding:5px 12px;font-size:12px}
.lr{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#1c1c1c;border-radius:10px;animation:sin .35s both}
.lr b{width:30px;text-align:center}.lr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr em{font-style:normal;font-weight:600}
.lr.me{outline:1px solid var(--b);background:#1b2a42}
#gate{overflow-y:auto}.gc{margin:auto;gap:10px;padding:22px 20px}.gl{width:52px;height:52px;border-radius:14px}
.pl{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:#0007;border:1px solid #ffffff22;transition:border-color .2s,box-shadow .2s}
.pl small{color:var(--m)}.pl.on{border-color:var(--b);box-shadow:0 0 0 3px #2a8cff33}
.dts{display:flex;gap:14px}.dts i{width:14px;height:14px;border-radius:50%;border:2px solid #ffffff40;transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .2s,border-color .2s}
.dts i.f{background:var(--b);border-color:var(--b);transform:scale(1.2)}
#kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#kp button{height:46px;font-size:20px;border:0;border-radius:12px;background:#ffffff12;transition:transform .12s,background .15s}
#kp button:active:not(:disabled){transform:scale(.9);background:#2a8cff55}
#kp button[data-k="清除"],#kp button[data-k="⌫"]{font-size:14px;color:var(--m)}
#go.rdy{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 8px 34px #2a8cffaa;transform:translateY(-1px)}}
#go.done{background:#1f8a68;animation:none}#go.done span{opacity:0}#go.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;animation:pp .4s cubic-bezier(.3,1.7,.5,1)}@keyframes pp{from{transform:scale(0)}}
button{position:relative;overflow:hidden}
.rpl{position:absolute;border-radius:50%;background:#ffffff40;transform:scale(0);animation:rpl .55s ease-out forwards;pointer-events:none;text-decoration:none}@keyframes rpl{to{transform:scale(1);opacity:0}}
#kp{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#1b2436f2,#0e131dfa);backdrop-filter:blur(18px);border-radius:26px 26px 0 0;border-top:1px solid #ffffff1f;box-shadow:0 -14px 50px #000a;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
#kp.open{transform:none}#kp::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#ffffff33;margin:0 auto 6px}
.kh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px}.kh small{letter-spacing:1px}
#kp .kd{border:0;background:0;color:var(--b);font-size:15px;font-weight:600;padding:6px 10px}
.kk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#kp .kk button{height:56px;font-size:26px;font-weight:400;border:1px solid #ffffff14;border-radius:18px;background:linear-gradient(180deg,#ffffff1c,#ffffff08);box-shadow:0 2px 0 #0006,inset 0 1px 0 #ffffff14;display:grid;place-items:center;transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
#kp .kk button:active:not(:disabled){transform:scale(.93) translateY(1px);background:linear-gradient(180deg,#3a9bff,#2a6df0);box-shadow:0 0 22px #2a8cff88}
#kp .kk button[data-k="清除"]{font-size:15px;color:var(--m)}#kp .kk button[data-k="⌫"]{color:#ff8a8a}
#gate{transition:opacity .35s,padding-bottom .35s}#gate.kb{padding-bottom:calc(340px + env(safe-area-inset-bottom))}
</style></head><body><main>
<section id="hm" class="on">
 <div class="l" id="me"></div><div class="g" id="st"></div>
 <div class="r"><button id="ins" onclick="inst()" style="background:var(--b);border-color:var(--b)">安裝 App</button><button onclick="reset()">重置帳戶</button><button onclick="out()">登出</button></div>
 <small>隨機抽取一檔上市股票與一段歷史，150 個交易日。成交價為當日收盤價，手續費 0.1425%（整股最低 20 元、零股最低 1 元）。</small>
</section>
<section id="tr">
 <div id="info"></div><div id="cw"><canvas id="cv"></canvas></div>
 <div id="tb"><button onclick="Z(-10)">＋</button><button onclick="Z(10)">－</button><button onclick="P(10)">◀</button><button onclick="P(-10)">▶</button><span class="sp"></span><button id="au" onclick="auto(1)" style="width:auto;padding:0 14px">自動</button><select id="sp" onchange="auto()"><option value="1500">慢</option><option value="700">中</option><option value="300" selected>快</option><option value="100">極快</option><option value="40">瞬間</option></select></div>
 
 <div id="pos"></div>
 <div id="ab"><button class="bu" onclick="dlg('b')">買入</button><button class="sl" onclick="dlg('s')">賣出</button><button class="nx" id="nx" onclick="nxt()">下一步</button></div>
</section>
<section id="rc"></section><section id="lb"></section>
</main>
<nav><button class="on" onclick="go('hm')">首頁</button><button onclick="go('tr')">訓練</button><button onclick="go('rc')">記錄</button><button onclick="go('lb')">排行榜</button></nav>
<div id="gate" hidden><div class="gc"><img class="gl" src="icon-192.png" alt=""><h2>K線訓練</h2><p class="l">建立你的交易員 ID，進度會跟著帳號走</p>
<div class="seg"><i id="pill"></i><button onclick="tab(0)">註冊</button><button onclick="tab(1)">登入</button></div>
<input id="gi" placeholder="ID（可用中文與符號）" maxlength="20" autocomplete="off"><div class="pl" id="r0"><small>PIN 碼</small><div class="dts"><i></i><i></i><i></i><i></i></div></div><div class="pl" id="r1"><small>再次確認</small><div class="dts"><i></i><i></i><i></i><i></i></div></div><p id="gm"></p><button id="go" onclick="submit()"><span>建立帳號</span></button></div><div id="kp"></div></div>
<dialog id="md"></dialog>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="firebase-config.js?v=2"></script>
<script>
const $=s=>document.querySelector(s),F=(n,d=2)=>Number(n).toFixed(d),C=v=>v>=0?'u':'d',sg=v=>(v>=0?'+':'')+F(v*100)+'%';
const fresh=()=>({eq:50000,ops:0,days:0,wins:0,sells:0,best:0,worst:0,dd:0,hist:[]});
let A=JSON.parse(localStorage.getItem('kt')||'null')||fresh(),S=null,N=80,Nf=80,off=0,timer=null,codes=null,sd,mx;
const save=()=>{localStorage.setItem('kt',JSON.stringify(A));push()};
const cp=()=>S.r[S.i][4],eq=()=>S.cash+S.sh*cp()-(S.sh?fee(cp(),S.sh):0);
const fee=(p,n)=>Math.max(n>=1000?20:1,Math.round(p*n*.001425));
function go(id){['hm','tr','rc','lb'].forEach((k,i)=>{$('#'+k).classList.toggle('on',k==id);document.querySelectorAll('nav button')[i].classList.toggle('on',k==id)});
 if(id=='tr'&&!S)start();if(id=='hm')home();if(id=='rc')recs();if(id=='lb')lb();if(id=='tr')draw()}
function home(){const pnl=A.eq-50000,c=[['初始資產','50000'],['現有資產',F(A.eq,0)],['總盈虧',`<span class=${C(pnl)}>${F(pnl,0)}</span>`],
 ['收益率',`<span class=${C(pnl)}>${sg(pnl/50000)}</span>`],['操作次數/天數',A.ops+'/'+A.days],['盈利次數',A.wins],
 ['成功率',A.sells?F(A.wins/A.sells*100)+'%':'--'],['最大盈利',`<span class=u>${sg(A.best)}</span>`],['最大虧損',`<span class=d>${sg(A.worst)}</span>`],['最大回撤',`<span class=d>${sg(A.dd)}</span>`]];
 $('#st').innerHTML=c.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}
function reset(){if(confirm('重置帳戶將清除所有紀錄，確定？')){A=fresh();S=null;save();home()}}
function prep(r){const c=r.map(x=>x[4]),ma=n=>c.map((_,i)=>i<n-1?null:c.slice(i-n+1,i+1).reduce((a,b)=>a+b)/n),
 ema=n=>{let e=c[0],k=2/(n+1);return c.map(v=>e=v*k+e*(1-k))},a=ema(12),b=ema(26),dif=a.map((v,i)=>v-b[i]);let e=dif[0];
 const dea=dif.map(v=>e=v*.2+e*.8);return{ma:[5,10,20,30].map(ma),dif,dea,h:dif.map((v,i)=>2*(v-dea[i]))}}
async function start(){stop();if(A.eq<100){alert('資金不足，請在首頁重置帳戶');return}
 try{codes=codes||await(await fetch('data/index.json')).json();const code=codes[Math.random()*codes.length|0],j=await(await fetch(`data/${code}.json`)).json(),r=j.r,s=60+Math.random()*(r.length-211)|0;
 S={code,name:j.n,r,s,i:s,I:prep(r),cash:A.eq,sh:0,cost:0,start:A.eq,tr:[],hold:0,buy:0,peak:A.eq,dd:0,done:false};N=80;Nf=80;off=0;go('tr');render()}
 catch(e){alert('讀不到 data/ 資料，請先執行 fetch_data.py 並一併上傳 data 資料夾')}}
function next(){if(!S||S.done)return;S.i++;if(S.sh)S.hold++;const e=eq();S.peak=Math.max(S.peak,e);S.dd=Math.min(S.dd,e/S.peak-1);off=0;render();if(S.i>=S.s+150)end()}
function nxt(){timer?stop():next()}
function auto(on){if(!S||S.done||(!on&&!timer))return;clearInterval(timer);timer=setInterval(next,+$('#sp').value);ui()}
function stop(){clearInterval(timer);timer=null;ui()}
function ui(){const b=$('#nx');b.textContent=timer?'停止自動':'下一步';b.style.background=timer?'#e08a00':'';$('#au').disabled=!!timer}
function maxBuy(p){let n=Math.floor(S.cash/(p*1.001425));while(n>0&&p*n+fee(p,n)>S.cash)n--;return n}
function trade(side,n){if(side=='s'&&n>S.sh)return;const p=cp(),f=fee(p,n);
 if(side=='b'){S.cash-=p*n+f;S.cost=(S.cost*S.sh+p*n+f)/(S.sh+n);S.sh+=n;S.buy=Math.max(S.buy,S.cost*S.sh)}
 else{S.cash+=p*n-f;A.sells++;if(p*n-f>S.cost*n)A.wins++;S.sh-=n;if(!S.sh)S.cost=0}
 A.ops++;S.tr.push([S.i-S.s,side,p,n,f]);save();render()}
function dlg(side){if(!S||S.done)return;stop();const p=cp();mx=side=='b'?maxBuy(p):S.sh;if(mx<1)return alert(side=='b'?'資金不足':'目前無持倉');sd=side;
 $('#md').innerHTML=`<h3>${side=='b'?'買入':'賣出'}股票</h3><p>價格 ${F(p)}　可用資金 ${F(S.cash,0)}</p>
 <div class=r><button onclick="st(-1)">－</button><input id=q type=number inputmode=numeric value=${mx>=1000?1000:mx} oninput=up()><button onclick="st(1)">＋</button></div>
 <p class=l>最多 ${mx} 股（每次 ± 1000 股，可手動輸入零股）<br>費用 <span id=fe></span></p>
 <div class=r>${[['全倉',1],['1/2',2],['1/3',3],['1/4',4]].map(([l,d])=>`<button onclick="qf(${d})">${l}</button>`).join('')}</div>
 <div class=r style="margin-top:14px"><button onclick="$('#md').close()">取消</button><button id=ok style="background:var(--b);border-color:var(--b)">${side=='b'?'買入':'賣出'}</button></div>`;
 $('#ok').onclick=()=>{trade(sd,qv());$('#md').close()};show();up()}
const qv=()=>Math.min(mx,Math.max(1,parseInt($('#q').value)||1));
function up(){const n=qv();$('#fe').textContent=fee(cp(),n)+' 元（成交額 '+F(cp()*n,0)+'）'}
function st(d){$('#q').value=Math.min(mx,Math.max(1,qv()+d*(mx>=1000?1000:1)));up()}
function qf(d){const v=mx/d|0;$('#q').value=v>=1000?v-v%1000:Math.max(1,v);up()}
function fin(){if(!S||S.done)return;if(confirm('提前結束並結算？'))end()}
function end(){stop();const p=cp();if(S.sh){const f=fee(p,S.sh);S.cash+=p*S.sh-f;A.ops++;A.sells++;if(p*S.sh-f>S.cost*S.sh)A.wins++;S.tr.push([S.i-S.s,'s',p,S.sh,f]);S.sh=0}
 const pnl=S.cash-S.start,rg=S.r[S.i][4]/S.r[S.s][4]-1,pr=pnl/S.start;S.done=true;A.eq=S.cash;A.days+=S.i-S.s;A.best=Math.max(A.best,pr);A.worst=Math.min(A.worst,pr);A.dd=Math.min(A.dd,S.dd);
 A.hist.unshift({code:S.code,name:S.name,from:S.r[S.s][0],to:S.r[S.i][0],at:new Date().toLocaleString('zh-TW',{hour12:false}),pnl,ar:pr,ir:S.buy?pnl/S.buy:0,hold:S.hold,note:'',tr:S.tr});save();render();
 $('#md').innerHTML=`<h3>結束訓練</h3><p class=l>本股總收益</p><p class=${C(pnl)} style="font-size:24px">${pnl>=0?'+':''}${F(pnl,0)}　${sg(pr)}</p>
 <p>${S.name} ${S.code}</p><p class=l>${S.r[S.s][0]} ～ ${S.r[S.i][0]}　區間漲幅 <span class=${C(rg)}>${sg(rg)}</span></p>
