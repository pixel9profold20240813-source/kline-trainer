<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K線訓練</title>
<style>
:root{--bg:#141414;--p:#222;--t:#e6e6e6;--m:#8a8a8a;--u:#ff5252;--d:#26a17b;--b:#2a8cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--t);font:14px system-ui,"PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
section{display:none;flex:1;min-height:0;overflow:auto;padding:12px}
section.on{display:flex;flex-direction:column;gap:10px}
#tr{padding:6px 0 0}
nav{display:flex;background:#000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;color:var(--m);padding:12px 0;font-size:13px;border-radius:0}
nav .on{color:var(--u)}
button{font:inherit;color:var(--t);background:var(--p);border:1px solid #444;border-radius:6px;padding:8px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--b)}
.u{color:var(--u)}.d{color:var(--d)}small,.l{color:var(--m);font-size:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}.g b{display:block;font-size:17px;font-weight:500;margin-top:2px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
#tr.on{gap:0}#info{padding:6px 12px 2px;line-height:1.45;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}#info .x{flex:none;padding:6px 14px;font-size:13px}
#cw{flex:1;min-height:0;position:relative}#cv{position:absolute;inset:0;width:100%;height:100%}
#tb{display:flex;align-items:center;gap:6px;padding:6px 12px}#tb button{flex:none;width:38px;height:34px;padding:0;font-size:15px}#tb .sp{flex:1}#tb label{display:flex;align-items:center;gap:4px;white-space:nowrap}#tb select{height:34px;background:var(--p);color:var(--t);border:1px solid #444;border-radius:6px;padding:0 8px;font:inherit}#ab{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;padding:8px 12px}#ab button{height:48px;font-size:16px;font-weight:600;border:0;color:#fff}#ab .bu{background:#d63a3a}#ab .sl{background:#1f8a68}#ab .nx{background:var(--b)}
#pos{padding:8px 12px;background:#1a1a1a}#pos .g{gap:8px}#pos .g b{font-size:14px}
dialog{margin:auto;width:min(92vw,420px);background:#1c1c1c;color:var(--t);border:1px solid #333;border-radius:14px;padding:18px}
dialog::backdrop{background:#000a}dialog h3{margin-bottom:12px;font-weight:500}dialog p{margin:10px 0}
dialog input{width:100%;padding:10px;background:#111;color:var(--t);border:1px solid #444;border-radius:6px;text-align:center;font-size:16px}
.c{background:#1c1c1c;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.c .h{display:flex;justify-content:space-between;align-items:center}
.tag{padding:4px 12px;border-radius:14px;background:#2a2a2a}
.nt{background:#262626;border-radius:8px;padding:10px;font-style:italic;color:var(--m)}
@media(orientation:landscape) and (max-height:600px){#tr.on{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto auto auto 1fr}#cw{grid-column:1;grid-row:1/5}#info{grid-column:2;grid-row:1}#pos{grid-column:2;grid-row:2}#tb{grid-column:2;grid-row:3}#ab{grid-column:2;grid-row:4;align-self:end}#pos .g{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<section id="hm" class="on">
 <div class="g" id="st"></div>
 <div class="r"><button onclick="start()" style="background:var(--b);border-color:var(--b)">開始訓練</button><button onclick="reset()">重置帳戶</button></div>
 <small>隨機抽取一檔上市股票與一段歷史，150 個交易日。成交價為當日收盤價，手續費 0.1425%（整股最低 20 元、零股最低 1 元）。</small>
</section>
<section id="tr">
 <div id="info"></div><div id="cw"><canvas id="cv"></canvas></div>
 <div id="tb"><button onclick="Z(-10)">＋</button><button onclick="Z(10)">－</button><button onclick="P(10)">◀</button><button onclick="P(-10)">▶</button><span class="sp"></span><button id="au" onclick="auto(1)" style="width:auto;padding:0 14px">自動</button><select id="sp" onchange="auto()"><option value="1500">慢</option><option value="700">中</option><option value="300" selected>快</option><option value="100">極快</option><option value="40">瞬間</option></select></div>
 
 <div id="pos"></div>
 <div id="ab"><button class="bu" onclick="dlg('b')">買入</button><button class="sl" onclick="dlg('s')">賣出</button><button class="nx" id="nx" onclick="nxt()">下一步</button></div>
</section>
<section id="rc"></section>
</main>
<nav><button class="on" onclick="go('hm')">首頁</button><button onclick="go('tr')">訓練</button><button onclick="go('rc')">記錄</button></nav>
<dialog id="md"></dialog>
<script>
const $=s=>document.querySelector(s),F=(n,d=2)=>Number(n).toFixed(d),C=v=>v>=0?'u':'d',sg=v=>(v>=0?'+':'')+F(v*100)+'%';
const fresh=()=>({eq:50000,ops:0,days:0,wins:0,sells:0,best:0,worst:0,dd:0,hist:[]});
let A=JSON.parse(localStorage.getItem('kt')||'null')||fresh(),S=null,N=80,off=0,timer=null,codes=null,sd,mx;
const save=()=>localStorage.setItem('kt',JSON.stringify(A));
const cp=()=>S.r[S.i][4],eq=()=>S.cash+S.sh*cp()-(S.sh?fee(cp(),S.sh):0);
const fee=(p,n)=>Math.max(n>=1000?20:1,Math.round(p*n*.001425));
function go(id){['hm','tr','rc'].forEach((k,i)=>{$('#'+k).classList.toggle('on',k==id);document.querySelectorAll('nav button')[i].classList.toggle('on',k==id)});
 if(id=='tr'&&!S)start();if(id=='hm')home();if(id=='rc')recs();if(id=='tr')draw()}
function home(){const pnl=A.eq-50000,c=[['初始資產','50000'],['現有資產',F(A.eq,0)],['總盈虧',`<span class=${C(pnl)}>${F(pnl,0)}</span>`],
 ['收益率',`<span class=${C(pnl)}>${sg(pnl/50000)}</span>`],['操作次數/天數',A.ops+'/'+A.days],['盈利次數',A.wins],
 ['成功率',A.sells?F(A.wins/A.sells*100)+'%':'--'],['最大盈利',`<span class=u>${sg(A.best)}</span>`],['最大虧損',`<span class=d>${sg(A.worst)}</span>`],['最大回撤',`<span class=d>${sg(A.dd)}</span>`]];
 $('#st').innerHTML=c.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}
function reset(){if(confirm('重置帳戶將清除所有紀錄，確定？')){A=fresh();S=null;save();home()}}
function prep(r){const c=r.map(x=>x[4]),ma=n=>c.map((_,i)=>i<n-1?null:c.slice(i-n+1,i+1).reduce((a,b)=>a+b)/n),
 ema=n=>{let e=c[0],k=2/(n+1);return c.map(v=>e=v*k+e*(1-k))},a=ema(12),b=ema(26),dif=a.map((v,i)=>v-b[i]);let e=dif[0];
 const dea=dif.map(v=>e=v*.2+e*.8);return{ma:[5,10,20,30].map(ma),dif,dea,h:dif.map((v,i)=>2*(v-dea[i]))}}
async function start(){stop();if(A.eq<100){alert('資金不足，請在首頁重置帳戶');return}
 try{codes=codes||await(await fetch('data/index.json')).json();const code=codes[Math.random()*codes.length|0],j=await(await fetch(`data/${code}.json`)).json(),r=j.r,s=60+Math.random()*(r.length-211)|0;
 S={code,name:j.n,r,s,i:s,I:prep(r),cash:A.eq,sh:0,cost:0,start:A.eq,tr:[],hold:0,buy:0,peak:A.eq,dd:0,done:false};N=80;off=0;go('tr');render()}
 catch(e){alert('讀不到 data/ 資料，請先執行 fetch_data.py 並一併上傳 data 資料夾')}}
function next(){if(!S||S.done)return;S.i++;if(S.sh)S.hold++;const e=eq();S.peak=Math.max(S.peak,e);S.dd=Math.min(S.dd,e/S.peak-1);off=0;render();if(S.i>=S.s+150)end()}
function nxt(){timer?stop():next()}
function auto(on){if(!S||S.done||(!on&&!timer))return;clearInterval(timer);timer=setInterval(next,+$('#sp').value);ui()}
function stop(){clearInterval(timer);timer=null;ui()}
function ui(){const b=$('#nx');b.textContent=timer?'停止自動':'下一步';b.style.background=timer?'#e08a00':'';$('#au').disabled=!!timer}
function maxBuy(p){let n=Math.floor(S.cash/(p*1.001425));while(n>0&&p*n+fee(p,n)>S.cash)n--;return n}
function trade(side,n){if(side=='s'&&n>S.sh)return;const p=cp(),f=fee(p,n);
 if(side=='b'){S.cash-=p*n+f;S.cost=(S.cost*S.sh+p*n+f)/(S.sh+n);S.sh+=n;S.buy=Math.max(S.buy,S.cost*S.sh)}
 else{S.cash+=p*n-f;A.sells++;if(p*n-f>S.cost*n)A.wins++;S.sh-=n;if(!S.sh)S.cost=0}
 A.ops++;S.tr.push([S.i-S.s,side,p,n,f]);save();render()}
function dlg(side){if(!S||S.done)return;stop();const p=cp();mx=side=='b'?maxBuy(p):S.sh;if(mx<1)return alert(side=='b'?'資金不足':'目前無持倉');sd=side;
 $('#md').innerHTML=`<h3>${side=='b'?'買入':'賣出'}股票</h3><p>價格 ${F(p)}　可用資金 ${F(S.cash,0)}</p>
 <div class=r><button onclick="st(-1)">－</button><input id=q type=number inputmode=numeric value=${mx>=1000?1000:mx} oninput=up()><button onclick="st(1)">＋</button></div>
 <p class=l>最多 ${mx} 股（每次 ± 1000 股，可手動輸入零股）<br>費用 <span id=fe></span></p>
 <div class=r>${[['全倉',1],['1/2',2],['1/3',3],['1/4',4]].map(([l,d])=>`<button onclick="qf(${d})">${l}</button>`).join('')}</div>
 <div class=r style="margin-top:14px"><button onclick="$('#md').close()">取消</button><button id=ok style="background:var(--b);border-color:var(--b)">${side=='b'?'買入':'賣出'}</button></div>`;
 $('#ok').onclick=()=>{trade(sd,qv());$('#md').close()};$('#md').showModal();up()}
const qv=()=>Math.min(mx,Math.max(1,parseInt($('#q').value)||1));
function up(){const n=qv();$('#fe').textContent=fee(cp(),n)+' 元（成交額 '+F(cp()*n,0)+'）'}
function st(d){$('#q').value=Math.min(mx,Math.max(1,qv()+d*(mx>=1000?1000:1)));up()}
function qf(d){const v=mx/d|0;$('#q').value=v>=1000?v-v%1000:Math.max(1,v);up()}
function fin(){if(!S||S.done)return;if(confirm('提前結束並結算？'))end()}
function end(){stop();const p=cp();if(S.sh){const f=fee(p,S.sh);S.cash+=p*S.sh-f;A.ops++;A.sells++;if(p*S.sh-f>S.cost*S.sh)A.wins++;S.tr.push([S.i-S.s,'s',p,S.sh,f]);S.sh=0}
 const pnl=S.cash-S.start,rg=S.r[S.i][4]/S.r[S.s][4]-1,pr=pnl/S.start;S.done=true;A.eq=S.cash;A.days+=S.i-S.s;A.best=Math.max(A.best,pr);A.worst=Math.min(A.worst,pr);A.dd=Math.min(A.dd,S.dd);
 A.hist.unshift({code:S.code,name:S.name,from:S.r[S.s][0],to:S.r[S.i][0],at:new Date().toLocaleString('zh-TW',{hour12:false}),pnl,ar:pr,ir:S.buy?pnl/S.buy:0,hold:S.hold,note:'',tr:S.tr});save();render();
 $('#md').innerHTML=`<h3>結束訓練</h3><p class=l>本股總收益</p><p class=${C(pnl)} style="font-size:24px">${pnl>=0?'+':''}${F(pnl,0)}　${sg(pr)}</p>
 <p>${S.name} ${S.code}</p><p class=l>${S.r[S.s][0]} ～ ${S.r[S.i][0]}　區間漲幅 <span class=${C(rg)}>${sg(rg)}</span></p>
 <div class=r style="margin-top:14px"><button onclick="$('#md').close()">復盤</button><button onclick="$('#md').close();start()" style="background:var(--b);border-color:var(--b)">換股</button></div>`;$('#md').showModal()}
function render(){if(!S)return;const r=S.r,i=S.i,x=r[i],p=x[4],pv=i?r[i-1][4]:x[1],ch=p/pv-1,mv=S.sh*p,e=eq(),sf=S.sh?fee(p,S.sh):0,pl=S.sh?(p-S.cost)*S.sh-sf:0,tp=e-S.start;
 $('#info').innerHTML=`<div><b class=${C(ch)} style="font-size:22px">${F(p)}</b> <span class=${C(ch)}>${sg(ch)}</span> <small>${S.done?S.name+' '+S.code+' '+x[0]:'第 '+(i-S.s)+' / 150 天'}</small><br><small>開 ${F(x[1])}　高 ${F(x[2])}　低 ${F(x[3])}　量 ${x[5]} 張</small></div>${S.done?'':"<button class=x onclick=fin()>結束</button>"}`;
 const cell=(a,b)=>`<div><small>${a}</small><b>${b}</b></div>`;
 $('#pos').innerHTML='<div class=g>'+cell('市值',F(mv,0))+cell('盈虧',`<span class=${C(pl)}>${F(pl,0)}${S.sh?' '+sg(pl/(S.cost*S.sh)):''}</span>`)+cell('持倉',S.sh||'--')+
 cell('成本/現價',(S.sh?F(S.cost):'--')+' / '+F(p))+cell('總資產/可用',F(e,0)+' / '+F(S.cash,0))+cell('總盈虧',`<span class=${C(tp)}>${F(tp,0)} ${sg(tp/S.start)}</span>`)+'</div>';draw()}
const Z=d=>{N=Math.min(250,Math.max(20,N+d));draw()},P=d=>{if(S){off=Math.min(S.i-10,Math.max(0,off+d));draw()}};
function draw(){const cv=$('#cv'),w=cv.clientWidth,h=cv.clientHeight,dp=devicePixelRatio||1;if(!w)return;cv.width=w*dp;cv.height=h*dp;const g=cv.getContext('2d');g.scale(dp,dp);if(!S)return;
 const{r,I}=S,end=S.i+1-off,st=Math.max(0,end-N),pw=w*.82,bw=pw/N,Pn=[28,h*.6-18],V=[h*.63,h*.79],M=[h*.82,h-4];let hi=-1e9,lo=1e9,vm=1,mm=1e-9;
 for(let k=st;k<end;k++){hi=Math.max(hi,r[k][2]);lo=Math.min(lo,r[k][3]);vm=Math.max(vm,r[k][5]);mm=Math.max(mm,Math.abs(I.dif[k]),Math.abs(I.dea[k]),Math.abs(I.h[k]))}
 if(S.sh){hi=Math.max(hi,S.cost);lo=Math.min(lo,S.cost)}const yP=v=>Pn[1]-(v-lo)/(hi-lo||1)*(Pn[1]-Pn[0]),yV=v=>V[1]-v/vm*(V[1]-V[0]),yM=v=>(M[0]+M[1])/2-v/mm*(M[1]-M[0])/2,X=k=>(k-st+.5)*bw,col=up=>up?'#ff5252':'#26a17b';
 g.lineWidth=1;g.font='11px system-ui';
 for(let k=st;k<end;k++){const[,o,hh,l,c,v]=r[k],u=c>=o,x=X(k);g.fillStyle=g.strokeStyle=col(u);g.beginPath();g.moveTo(x,yP(hh));g.lineTo(x,yP(l));g.stroke();
  const t=yP(Math.max(o,c)),bt=Math.max(1,Math.abs(yP(o)-yP(c)));g.fillRect(x-bw*.38,t,bw*.76,bt);g.fillRect(x-bw*.38,yV(v),bw*.76,V[1]-yV(v));
  g.fillStyle=col(I.h[k]>=0);const z=yM(0),hy=yM(I.h[k]);g.fillRect(x-bw*.3,Math.min(z,hy),bw*.6,Math.max(1,Math.abs(hy-z)))}
 const line=(arr,f,c)=>{g.strokeStyle=c;g.beginPath();let on=0;for(let k=st;k<end;k++){if(arr[k]==null)continue;on?g.lineTo(X(k),f(arr[k])):g.moveTo(X(k),f(arr[k]));on=1}g.stroke()};
 ['#fff','#e040fb','#ff9800','#5c6bff'].forEach((c,j)=>line(I.ma[j],yP,c));line(I.dif,yM,'#fff');line(I.dea,yM,'#26c6da');
 S.tr.forEach(t=>{const k=S.s+t[0];if(k<st||k>=end)return;const b=t[1]=='b',x=X(k),y=b?yP(r[k][3])+6:yP(r[k][2])-6;g.fillStyle=b?'#ff5252':'#26a17b';g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+(b?10:-10));g.lineTo(x+6,y+(b?10:-10));g.closePath();g.fill();g.stroke();g.fillStyle='#fff';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(b?'買':'賣',x,b?y+22:y-14);g.textAlign='left';g.font='11px system-ui'});
 if(S.sh){g.strokeStyle='#ff3b3b';g.lineWidth=1.5;g.beginPath();g.moveTo(0,yP(S.cost));g.lineTo(w,yP(S.cost));g.stroke();g.lineWidth=1}g.setLineDash([5,4]);g.strokeStyle='#2a8cff';g.beginPath();g.moveTo(0,yP(r[S.i][4]));g.lineTo(w,yP(r[S.i][4]));g.stroke();g.setLineDash([]);
 
 g.fillStyle='#8a8a8a';g.fillText(F(hi),pw+6,Pn[0]+8);g.fillText(F(lo),pw+6,Pn[1]);g.fillStyle='#2a8cff';g.fillText(F(r[S.i][4]),pw+6,yP(r[S.i][4])-3);if(S.sh){g.fillStyle='#ff3b3b';g.fillText(F(S.cost),pw+6,yP(S.cost)+11)}
 g.fillStyle='#8a8a8a';g.fillText('成交量',4,V[0]+10);g.fillText('MACD(12,26,9)',4,M[0]+10);
 g.strokeStyle='#2a2a2a';[V[0]-3,M[0]-3].forEach(y=>{g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()})}
function recs(){$('#rc').innerHTML=A.hist.map((h,k)=>`<div class=c><div class=h><div><b>${S&&!S.done&&k==0?'訓練中':h.name}</b><br><small>${h.code}</small></div><span class="tag ${C(h.ar)}">${sg(h.ar)}</span></div>
 <small>時間範圍 ${h.from} ~ ${h.to}<br>訓練時間 ${h.at}　持倉 ${h.hold} 天</small>
 <div class=g><div><small>盈虧</small><b class=${C(h.pnl)}>${F(h.pnl,0)}</b></div><div><small>帳戶收益率</small><b class=${C(h.ar)}>${sg(h.ar)}</b></div><div><small>投入回報率</small><b class=${C(h.ir)}>${sg(h.ir)}</b></div></div>
 <div class=nt onclick="note(${k})">${h.note||'暫無心得，點此記錄這次訓練的思考'}</div>
 <details><summary class=l>交易明細（${h.tr.length} 筆）</summary>${h.tr.map(t=>`<small>第${t[0]}天 ${t[1]=='b'?'買':'賣'} ${t[3]}股 @${F(t[2])} 費${t[4]}</small><br>`).join('')}</details></div>`).join('')||'<small>尚無紀錄，完成一次訓練後會出現在這裡。</small>'}
function note(k){const v=prompt('心得',A.hist[k].note);if(v!==null){A.hist[k].note=v;save();recs()}}
addEventListener('resize',draw);home();
</script></body></html>
